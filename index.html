<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lohith K Aditya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portfolio of Lohith K Aditya: engineering roots, operations experience, product case studies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: three pages behind one tab bar. A Swiss 4-column hairline grid,
   light paper pages with one dark band for the work, heavy wide grotesk headlines,
   mono labels, and a single orange→violet glow used for active states and contact.
   Single deliberate light look. */
:root{
  --ground:#ECECEE; --paper:#F7F7F8; --white:#FFFFFF;
  --ink:#121214; --ink-2:#3B3B42; --mute:#8E8E97; --mute-dark:#5E5E66;
  --night:#111113; --night-2:#1B1B1F; --night-text:#B2B2BA; --night-mute:#7A7A82;
  --line:rgba(18,18,20,.09); --line-dark:rgba(255,255,255,.08);
  --hot:#FF5B35; --violet:#B23CE0; --sky:#7C8CFF; --ok:#1FA35B;
  --glow:linear-gradient(90deg,var(--violet),var(--sky) 45%,var(--hot));

  --display:"Archivo","Arial Narrow",Helvetica,Arial,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --max:1180px;
  --radius:14px;
  --head:72px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ground)}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px;border-radius:4px}
[id]{scroll-margin-top:calc(var(--head) + env(safe-area-inset-top,0px) + 16px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- primitives ---------- */
.band{position:relative;isolation:isolate}
.band.dark{background:var(--night);color:var(--paper)}
.band.paper{background:var(--paper)}
.wrap{position:relative;max-width:calc(var(--max) + 64px);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r);padding-block:clamp(48px,7vw,88px)}
.lines{position:absolute;top:0;bottom:0;left:max(var(--gut),calc((100% - var(--max)) / 2));right:max(var(--gut-r),calc((100% - var(--max)) / 2));pointer-events:none;z-index:-1;
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:25% 100%;border-right:1px solid var(--line)}
.dark .lines{background-image:linear-gradient(to right,var(--line-dark) 1px,transparent 1px);border-right-color:var(--line-dark)}

.label{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.label b{font-weight:500;color:var(--ink)}
.dark .label b{color:var(--paper)}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.dark .label::before{background:var(--paper)}
.h-lg,.h-md{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:.94;margin:0;text-wrap:balance}
.h-lg{font-size:clamp(34px,5.4vw,72px)}
.h-md{font-size:clamp(22px,2.6vw,32px);letter-spacing:-.025em;line-height:1}
.muted{color:var(--mute)}
.dark .muted{color:var(--night-mute)}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 24px;border-radius:999px;
  font-family:var(--display);font-stretch:108%;font-weight:700;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;text-decoration:none;
  border:1px solid transparent;cursor:pointer;transition:transform .25s ease,background .25s ease,color .25s ease}
.btn:hover{transform:translateY(-2px)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.white{background:var(--white);color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 16px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);transition:background .2s,color .2s,border-color .2s;cursor:pointer}
.chip small{font-size:10px;color:var(--mute)}
.chip:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:hover small{color:#a5a5ad}
.dark .chip{background:transparent;border-color:#3a3a41;color:var(--paper)}
.dark .chip:hover{background:var(--paper);color:var(--ink)}

/* ---------- header with page tabs ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(236,236,238,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:calc(var(--max) + 64px);margin:0 auto;padding:12px var(--gut-r) 12px var(--gut);min-height:var(--head);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 16px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-stretch:110%;font-weight:800;font-size:15px;letter-spacing:-.01em;min-width:0}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;padding:4px;background:var(--white);border:1px solid var(--line);border-radius:999px}
.tab{display:inline-flex;align-items:baseline;justify-content:center;gap:7px;padding:9px 18px;border-radius:999px;text-decoration:none;
  font-family:var(--display);font-stretch:108%;font-weight:700;font-size:12.5px;text-transform:uppercase;color:var(--mute-dark);transition:background .25s,color .25s}
.tab small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--mute)}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tab[aria-current="page"] small{color:#9a9aa2}
.top-right{justify-self:end;display:flex;align-items:center;gap:8px}
@media (max-width:760px){
  :root{--head:112px}
  .top-in{grid-template-columns:minmax(0,1fr) auto;padding-block:10px}
  .tabs{grid-column:1/-1;grid-row:2}
  .tab{flex:1;padding:9px 6px}
  .top-right .resume{display:none}
}

/* ---------- pages ---------- */
.page.enter{animation:pageIn .45s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hit{animation:hit 1.6s ease-out}
@keyframes hit{0%,30%{box-shadow:0 0 0 2px var(--hot)}100%{box-shadow:0 0 0 2px transparent}}

.phead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 24px;align-items:end}
.phead p{margin:0;color:var(--ink-2);max-width:52ch;justify-self:end}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.jump .mono{align-self:center;color:var(--mute);margin-right:4px}
@media (max-width:820px){.phead{grid-template-columns:1fr}.phead p{justify-self:start}}

.pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pager a{display:flex;flex-direction:column;gap:6px;padding:28px 0;text-decoration:none;min-width:0}
.pager a:last-child{text-align:right;align-items:flex-end;border-left:1px solid var(--line);padding-left:24px}
.pager a:first-child{padding-right:24px}
.pager .mono{color:var(--mute)}
.pager strong{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(22px,3.4vw,44px);line-height:1;transition:color .25s}
.pager a:hover strong{color:var(--hot)}
.pager-wrap{padding-block:0 8px}

/* ---------- HOME: hero ---------- */
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center;padding-top:clamp(36px,5vw,64px)}
.status{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-dark);
  padding:7px 12px;border-radius:999px;background:var(--white);border:1px solid var(--line)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative}
.status i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ok);animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.name{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.9;margin:22px 0 0;font-size:clamp(46px,7.6vw,104px);text-wrap:balance}
.tagline{margin:18px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--display);font-stretch:110%;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(17px,1.9vw,24px);line-height:1.1}
.tagline span:nth-child(2){color:var(--mute)}
.intro{margin:18px 0 0;font-size:clamp(15px,1.25vw,17px);color:var(--mute-dark);max-width:50ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:22px}
.quick a,.quick button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;background:none;border:0;padding:4px 0;cursor:pointer;border-bottom:1px solid var(--line)}
.quick a:hover,.quick button:hover{border-bottom-color:var(--ink)}

.photo{position:relative;margin:0;justify-self:end;width:100%;max-width:400px;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;background:#d9d9dc}
.photo .base,.photo .slice{position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-repeat:no-repeat;background-position:50% 0;filter:grayscale(1) contrast(1.15) brightness(1.04)}
.photo .slice{clip-path:inset(var(--t) 0 calc(100% - var(--t) - var(--h)) 0);transform:none}
.photo .slice::after{content:"";position:absolute;inset:0;background:var(--tint);mix-blend-mode:screen;opacity:0;transition:opacity .2s}
.photo.glitching .slice::after,.photo:hover .slice::after{opacity:.8}
.photo.glitching .slice{animation:jit .6s steps(2,end) both}
.photo:hover .slice{animation:jit .9s steps(3,end) infinite}
@keyframes jit{0%,100%{transform:none}20%{transform:translateX(var(--x))}45%{transform:translateX(calc(var(--x) * -1.3))}70%{transform:translateX(calc(var(--x) * .6))}}
.photo .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);pointer-events:none}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:40px 14px 12px;
  background:linear-gradient(to top,rgba(17,17,19,.75),transparent);color:var(--paper);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr}
  .photo{grid-row:1;justify-self:start;max-width:220px}
}

/* key facts */
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.fact{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:150px;padding:18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--paper);text-decoration:none;transition:background .25s}
.fact strong{font-family:var(--display);font-stretch:110%;font-weight:600;font-size:clamp(30px,3.4vw,46px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.fact span{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute-dark);max-width:20ch}
.fact::after{content:"↗";position:absolute;top:14px;right:16px;font-size:15px;color:var(--mute);transition:transform .25s,color .25s}
.fact:hover{background:var(--white)}
.fact:hover::after{transform:translate(2px,-2px);color:var(--hot)}
.fact::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--glow);transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
.fact:hover::before{transform:scaleX(1)}
@media (max-width:820px){.facts{grid-template-columns:1fr 1fr}.fact{min-height:120px}}

/* jump-in index */
.index{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:32px}
.idx header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px}
.idx header a{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--mute-dark)}
.idx header a:hover{color:var(--ink)}
.idx ul{list-style:none;margin:0;padding:0}
.idx-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;transition:padding .3s,background .3s}
.idx li:last-child .idx-item{border-bottom:1px solid var(--line)}
.idx-item:hover{background:var(--white);padding-left:10px;padding-right:10px}
.idx-item .n{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.idx-item b{display:block;font-family:var(--display);font-stretch:104%;font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.idx-item em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.arrow{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;transition:background .25s,color .25s,transform .3s;flex:none}
.idx-item:hover .arrow,.proj a:hover .arrow{background:var(--ink);color:var(--paper);transform:rotate(-45deg)}
@media (max-width:900px){.index{grid-template-columns:1fr;gap:32px}}

/* ---------- WORK: case studies ---------- */
.cases{margin-top:clamp(24px,4vw,40px);display:grid;gap:16px}
.case{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,48px);padding:clamp(20px,3vw,32px);border:1px solid var(--line-dark);border-radius:var(--radius);background:var(--night-2)}
.case-top{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--night-mute);margin:0}
.case-top b{color:var(--paper);font-weight:500}
.case h3{margin:12px 0 0;font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;letter-spacing:-.025em;line-height:1;font-size:clamp(22px,2.6vw,34px);text-wrap:balance}
.case-sum{margin:14px 0 0;color:var(--night-text);max-width:56ch}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px}
.tags span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#d0d0d6}
.tags span::before{content:"#";color:var(--night-mute)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:24px;border-top:1px solid var(--line-dark)}
.stats div{padding:14px 12px 4px 0}
.stats div+div{padding-left:12px;border-left:1px solid var(--line-dark)}
.stats strong{display:block;font-family:var(--display);font-stretch:110%;font-weight:700;font-size:clamp(24px,2.4vw,32px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--night-mute);line-height:1.45}
.mods{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line-dark)}
.mods li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line-dark)}
.mods .mono{color:var(--night-mute);grid-row:span 2}
.mods strong{font-weight:500}
.mods em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--night-mute)}
.ok{font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;background:#1f5135;color:#9ff0c0;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.method{margin:16px 0 0;color:var(--night-mute)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.case-side{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:860px){
  .case{grid-template-columns:1fr}
  .case-side{order:-1}
  .stats{grid-template-columns:1fr 1fr}
  .stats div:nth-child(3){padding-left:0;border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line-dark)}
}

/* case visuals */
.vis{position:relative;aspect-ratio:16/11;width:100%;max-width:100%;border-radius:10px;overflow:hidden;border:1px solid #2c2c33}
.vis img{width:100%;height:100%;object-fit:cover}
.vis-search{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:14px;background:linear-gradient(160deg,#24242a,#151518)}
.vis-search .bar{display:flex;align-items:center;gap:8px;background:#30303a;border-radius:999px;padding:9px 12px;font-size:12.5px;color:#e4e4ea;white-space:nowrap;overflow:hidden}
.vis-search .bar i{width:10px;height:10px;border:2px solid #9a9aa2;border-radius:50%;flex:none}
.caret{width:1px;height:14px;background:var(--hot);animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}
.vis-search .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:6px;min-height:0}
.vis-search .grid span{border-radius:5px;background:#2e2e35;position:relative;overflow:hidden;opacity:.6}
.vis-search .grid span::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);animation:shimmer 2.4s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.vis-search .none{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a92}
.vis-search .none b{color:var(--hot);font-weight:500}
.vis-voice{display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 120%,rgba(178,60,224,.38),transparent 55%),linear-gradient(160deg,#24242a,#151518)}
.wave{display:flex;align-items:center;gap:4px;height:56px}
.wave span{width:4px;border-radius:4px;background:var(--paper);height:20%;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{0%,100%{height:18%}50%{height:var(--h,80%)}}
.mic{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.mic::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(255,255,255,.4);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.5);opacity:0}}
.mic i{width:10px;height:16px;border-radius:6px;background:var(--ink)}
.vis-voice .hint{position:absolute;top:14px;left:14px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#a0a0a8}

/* projects */
.proj-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.proj{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.proj a{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .3s,background .3s}
.proj a:hover{padding-left:12px;padding-right:12px;background:var(--white)}
.proj .n{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.proj-name{font-family:var(--display);font-stretch:100%;font-weight:600;font-size:clamp(16px,1.8vw,21px);letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0}
.proj-name sup{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.04em;color:var(--mute);margin-left:6px;text-transform:uppercase}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.langs span{font-family:var(--mono);font-size:10px;letter-spacing:.04em;padding:4px 8px;border-radius:4px;background:var(--ink);color:var(--paper)}
.langs span:nth-child(2){background:#55555d}.langs span:nth-child(3){background:#8e8e97}
@media (max-width:600px){.proj a{grid-template-columns:auto minmax(0,1fr) auto}.langs{grid-column:2;grid-row:2;justify-content:flex-start}.proj .arrow{grid-column:3;grid-row:1/3}}

/* ---------- ABOUT ---------- */
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.exp-list{border-top:1px solid var(--line)}
.exp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
.logo{width:46px;height:46px;border-radius:10px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-stretch:110%;font-weight:800;font-size:13px}
.exp h3{margin:0;font-family:var(--display);font-stretch:106%;font-weight:700;font-size:clamp(16px,1.5vw,19px);letter-spacing:-.01em}
.exp .co{margin:2px 0 0;font-weight:500;color:var(--ink-2)}
.exp ul{margin:10px 0 0;padding-left:18px;color:var(--ink-2)}
.when{margin:0;text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.when b{display:block;color:var(--ink);font-weight:500}
@media (max-width:560px){.exp{grid-template-columns:auto minmax(0,1fr)}.when{grid-column:2;text-align:left}.when b{display:inline;margin-right:8px}}

.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.skill{padding-top:16px;position:relative}
.skill::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--glow)}
.skill h3{margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:clamp(20px,2vw,26px)}
.skill h3 small{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:7px 11px;border-radius:999px;background:var(--white);border:1px solid var(--line)}
@media (max-width:820px){.skills{grid-template-columns:1fr}}

.acc-grid,.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
.acc{position:relative;padding-top:16px;display:grid;gap:10px;align-content:start}
.acc::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--glow)}
.acc img{aspect-ratio:4/3;width:100%;max-width:100%;object-fit:cover;border-radius:6px}
.acc .yr{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mute)}
.acc h3{margin:0;font-family:var(--display);font-stretch:106%;font-weight:700;font-size:17px}
.acc p{margin:0;color:var(--ink-2);font-size:14px}
.member{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.member img,.member .ph{aspect-ratio:4/5;width:100%;max-width:100%;object-fit:cover;filter:grayscale(1);transition:filter .4s}
.member:hover img{filter:none}
.member .ph{background:var(--ground);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px;color:var(--mute)}
.member .who{padding:12px}
.member .who b{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.member .who span{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}

/* contact */
.contact{background:var(--ground);overflow:hidden}
.contact::before{content:"";position:absolute;z-index:-1;left:-15%;right:-15%;bottom:-55%;height:100%;border-radius:50%;
  background:radial-gradient(closest-side,transparent 62%,var(--hot) 70%,var(--violet) 80%,var(--sky) 88%,transparent 96%);filter:blur(42px);opacity:.7;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%) rotate(-3deg)}to{transform:translateX(5%) rotate(4deg)}}
.contact-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:end}
.contact h2{font-size:clamp(40px,6.6vw,92px)}
.contact p{color:var(--ink-2);max-width:46ch;margin:16px 0 0}
.email-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:28px}
.email{font-family:var(--display);font-stretch:106%;font-weight:700;font-size:clamp(18px,2.4vw,28px);letter-spacing:-.02em;overflow-wrap:anywhere;user-select:all}
.copy{display:inline-flex;align-items:center;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:8px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s}
.copy:hover,.copy.done{background:var(--ink);color:var(--paper)}
.contact-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.where{margin:0;text-align:right;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-dark)}
.where b{display:block;color:var(--ink);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.contact-grid{grid-template-columns:1fr}.where{text-align:left}}

.footer{background:var(--night);color:#8a8a92}
.footer .wrap{padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.footer a{text-decoration:none;color:var(--paper)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);visibility:hidden;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;z-index:80;transition:transform .35s ease,visibility .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.skip{position:absolute;left:-999px;top:8px}
.skip:focus{left:16px;z-index:90;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:6px}
</style>
</head>

  function applyPhoto(src){

    + '<div class="jump"><span class="mono">Go to</span>'+aboutSecs.map(function(s){ return '<a class="chip" href="#'+s.id+'">'+(s.n?'<small>'+pad(s.n)+'</small>':'')+esc(s.name)+'</a>'; }).join('')+'</div>'
    + '</div></section>';

  function expRow(e, logoText, title, sub, when, place){
    return '<article class="exp"'+(e._id?' id="'+e._id+'"':'')+'><div class="logo" aria-hidden="true">'+esc(logoText)+'</div><div><h3>'+esc(title)+'</h3><p class="co">'+esc(sub)+'</p>'
      + (has(e.points) ? '<ul>'+e.points.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>' : '') + '</div>'
      + '<p class="when"><b>'+esc(when)+'</b>'+esc(place||'')+'</p></article>';
  }
  function sec(id, cls, lab, title, inner){
    return '<section class="band '+cls+'" id="'+id+'">'+lines()+'<div class="wrap" style="padding-block:clamp(40px,5vw,64px)">'
      + '<div class="sec-head"><div><span class="label"><b>'+lab+'</b></span>'+(title?'<h2 class="h-md" style="margin-top:12px">'+title+'</h2>':'')+'</div></div>'+inner+'</div></section>';
  }
  about += sec('experience','paper','Experience','Where I have worked', '<div class="exp-list">'+exps.map(function(e){ return expRow(e, initials(e.company), e.role, e.company, e.period, e.place); }).join('')+'</div>');
  if(has(P.education)) about += sec('education','','Education','', '<div class="exp-list">'+P.education.map(function(e){ return expRow(e, initials(e.school), e.degree, e.school, e.period, ''); }).join('')+'</div>');
  if(has(P.skills)) about += sec('skills','','Skills','What I bring', '<div class="skills">'+P.skills.map(function(g){ return '<div class="skill"><h3>'+esc(g.group)+'<small>'+pad(g.items.length)+'</small></h3><div class="pills">'+g.items.map(function(s){return '<span>'+esc(s)+'</span>';}).join('')+'</div></div>'; }).join('')+'</div>');
  if(has(P.accomplishments)) about += sec('accomplishments','paper','Accomplishments','What I achieved', '<div class="acc-grid">'+P.accomplishments.map(function(a){ return '<article class="acc">'+(a.image?'<img src="'+esc(a.image)+'" alt="">':'')+'<span class="yr">'+esc(a.year)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.text)+'</p></article>'; }).join('')+'</div>');
  if(has(P.team)) about += sec('team','','Team','People I built with', '<div class="team-grid">'+P.team.map(function(m){ return '<article class="member">'+(m.photo?'<img src="'+esc(m.photo)+'" alt="'+esc(m.name)+'">':'<div class="ph" aria-hidden="true">'+initials(m.name)+'</div>')+'<div class="who"><b>'+esc(m.name)+'</b><span>'+esc(m.role)+(m.note?' · '+esc(m.note):'')+'</span></div></article>'; }).join('')+'</div>');

  var C = P.contact || {};
  about += '<section class="band contact" id="contact">'+lines()+'<div class="wrap">'
    + '<div class="contact-grid"><div><span class="label"><b>Contact</b></span><h2 class="h-lg" style="margin-top:16px">'+esc(C.title)+'</h2><p>'+esc(C.text)+'</p>'
    + '<div class="email-row"><span class="email">'+esc(pr.email)+'</span><button class="copy copy-email" type="button">Copy email</button></div>'
    + '<div class="contact-links">'+[ext(L.linkedin,'LinkedIn ↗','btn ink sm'), ext(L.resume,'Resume ↗','btn white sm'), ext(L.github,'GitHub ↗','btn white sm'), ext(L.nextleap,'NextLeap ↗','btn white sm')].join('')+'</div></div>'
    + '<p class="where">Based in<b>'+esc(first(pr.location))+' · <span class="clock"></span></b></p></div></div></section>';

  function pager(prevId, prevName, nextId, nextName){
    return '<section class="band"><div class="wrap pager-wrap"><div class="pager">'
      + '<a href="#'+prevId+'"><span class="mono">← Previous</span><strong>'+prevName+'</strong></a>'
      + '<a href="#'+nextId+'"><span class="mono">Next →</span><strong>'+nextName+'</strong></a></div></div></section>';
  }

  main.innerHTML =
      '<div class="page" id="home" data-page="home">'+home+pager('about','About','work','Work')+'</div>'
    + '<div class="page" id="work" data-page="work" hidden>'+work+pager('home','Home','about','About')+'</div>'
    + '<div class="page" id="about" data-page="about" hidden>'+about+pager('work','Work','home','Home')+'</div>';

  /* header + footer */
  document.getElementById('brandName').textContent = pr.name;
  loadPhoto();
  document.getElementById('topRight').innerHTML = (L.resume ? ext(L.resume,'Resume ↗','chip resume') : '') + '<a class="btn ink sm" href="#contact">Contact</a>';
  document.getElementById('footer').innerHTML = '<span>© '+new Date().getFullYear()+' '+esc(pr.name)+'</span><span>'+esc(pr.email)+'</span><a href="#home">Back to home ↑</a>';

  /* ---------- router: three pages, deep links to any item ---------- */
  var PAGES = ['home','work','about'], owner = {}, current = null;
  Array.prototype.forEach.call(document.querySelectorAll('.page'), function(pg){
    Array.prototype.forEach.call(pg.querySelectorAll('[id]'), function(el){ owner[el.id] = pg.getAttribute('data-page'); });
  });
  function go(token, push, animate){
    token = token || 'home';
    var page = PAGES.indexOf(token) > -1 ? token : owner[token];
    if(!page){ page = 'home'; token = 'home'; }
    var changed = page !== current;
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function(pg){
      var on = pg.getAttribute('data-page') === page;
      pg.hidden = !on;
      if(changed){ pg.classList.remove('enter'); if(on && animate !== false && current !== null && !reduce){ void pg.offsetWidth; pg.classList.add('enter'); } }
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
      if(t.getAttribute('data-tab') === page) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
    });
    current = page;
    if(token === page){ window.scrollTo(0, 0); }
    else {
      var el = document.getElementById(token);
      if(el){
        requestAnimationFrame(function(){
          el.scrollIntoView({behavior: (reduce || changed) ? 'auto' : 'smooth', block:'start'});
          el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
        });
      }
    }
    if(push){ try{ history.pushState(null, '', '#'+token); }catch(e){} }
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if(!a) return;
    var t = a.getAttribute('href').slice(1);
    if(t === 'main-content') return;
    e.preventDefault();
    go(t, true);
  });
  window.addEventListener('popstate', function(){ go(location.hash.slice(1), false); });
  window.addEventListener('hashchange', function(){ go(location.hash.slice(1), false); });
  go(location.hash.slice(1) || 'home', false, false);
  window.__go = go;

  /* ---------- small interactions ---------- */
  var photo = document.getElementById('photo');
  if(photo && !reduce){
    setInterval(function(){ if(current !== 'home') return; photo.classList.remove('glitching'); void photo.offsetWidth; photo.classList.add('glitching'); }, 3800);
  }
  if(!reduce){
    Array.prototype.forEach.call(document.querySelectorAll('[data-type]'), function(el){
      var full = el.getAttribute('data-type'), i = full.length, dir = -1;
      setInterval(function(){
        if(current !== 'work') return;
        i += dir;
        if(i <= 0){ dir = 1; i = 0; } else if(i >= full.length + 14){ dir = -1; }
        el.textContent = full.slice(0, Math.min(i, full.length));
      }, 70);
    });
  }
  function tick(){
    var txt = '';
    try{ txt = new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:pr.timezone||undefined}).format(new Date()).toUpperCase() + ' IST'; }catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('.clock'), function(c){ c.textContent = txt; });
  }
  tick(); setInterval(tick, 15000);

  var toast = document.getElementById('toast'), tt;
  function say(msg){ toast.textContent = msg; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('show'); }, 2400); }
  Array.prototype.forEach.call(document.querySelectorAll('.copy-email'), function(btn){
    btn.addEventListener('click', function(){
      var label = btn.textContent;
      function fallback(){
        go('contact', true);
        var span = document.querySelector('.email');
        if(span){ var r = document.createRange(); r.selectNodeContents(span); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
        say('Email selected. Press Ctrl+C to copy');
      }
      try{
        navigator.clipboard.writeText(pr.email).then(function(){
          btn.classList.add('done'); btn.textContent = 'Copied'; say('Email copied');
          setTimeout(function(){ btn.classList.remove('done'); btn.textContent = label; }, 2000);
        }, fallback);
      }catch(e){ fallback(); }
    });
  });
})();
</script>

</body>
</html>
